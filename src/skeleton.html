<meta name="theme-color" content="#14161c">
<link rel="icon" type="image/png" href="__ICON__">
<link rel="apple-touch-icon" href="__ICON__">
<title>带团妙妙小工具 · COC</title>

<body>
<div class="topbar">
  <header>
    <div class="brand"><b>🪄 带团妙妙小工具</b><small>Call of Cthulhu · 读卡 / NPC / 地图路线 / 战斗</small></div>
    <div class="row hbtn" style="gap:6px">
      <button class="small ghost" onclick="exportBackup()">⬇ 备份数据</button>
      <label class="small" style="flex-direction:row;gap:6px">⬆ 恢复备份
        <input type="file" accept=".json" id="fileRestore" style="display:none" onchange="restoreBackup(event)">
      </label>
      <button class="small ghost" onclick="openBgModal()">🎨 背景</button>
      <button class="small ghost" id="decorToggle" onclick="toggleDecor()" title="开关背景上一直漂浮的小图标">🐙 装饰</button>
      <button class="small ghost" onclick="openHelp()">❔ 说明</button>
    </div>
  </header>
  <nav id="nav"></nav>
</div>
<main>
  <section class="tab" id="tab-surveyors"></section>
  <section class="tab" id="tab-npcs"></section>
  <section class="tab" id="tab-maps"></section>
  <section class="tab" id="tab-combat"></section>
  <section class="tab" id="tab-settings"></section>
</main>
<footer>
  <div>数据保存在本机浏览器(可随时导出 json 备份)</div>
  <div>预祝大成功！问题联系：QQ460889415</div>
</footer>
<div class="floatpanel" id="floatPanel" hidden></div>
<div class="fsnav" id="fsNav" hidden></div>
<div class="modal-mask" id="actorModal" onclick="if(event.target===this)closeActorModal()"></div>
<div class="modal-mask" id="helpModal" onclick="if(event.target===this)this.classList.remove('open')"></div>
<div class="modal-mask" id="bgModal" onclick="if(event.target===this)this.classList.remove('open')"></div>
<div class="statusline" id="status"></div>
<script>__XLSX__</script>
